server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ảnh khuôn mặt / tệp đính kèm gửi lên Core & AI service.
    client_max_body_size 25m;

    # SPA: mọi route không phải file tĩnh đều trả index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker phải luôn revalidate để bản mới được nhận.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Asset có hash trong tên — cache dài hạn.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Core Service (Spring Boot): /api/v1/... -> core-service:8080/api/v1/...
    location /api/ {
        proxy_pass http://core-service:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # AI Face Service: /ai-face/api/v1/... -> ai-face-service:8000/api/v1/...
    # (trailing slash ở proxy_pass để cắt tiền tố /ai-face/)
    location /ai-face/ {
        proxy_pass http://ai-face-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
