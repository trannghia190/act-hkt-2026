server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: pulse-core-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pulse_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

  # Không dùng Keycloak/OAuth2 — xác thực bằng JWT tự phát hành (HS512).
  # Phiên refresh lưu trong bảng refresh_tokens để thu hồi được.

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 3000ms

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

app:
  notification:
    # Tự động xoá thông báo ĐÃ ĐỌC cũ hơn số ngày này; chưa đọc luôn được giữ.
    retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
  jwt:
    # HS512 yêu cầu tối thiểu 64 byte (512 bit). Thay bằng secret riêng khi triển khai.
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 900000          # 15 phút — business docs/01 §3.2
    refresh-expiration-ms: 604800000 # 7 ngày — business docs/01 §3.2
  mail:
    # Dev: chưa cấu hình SMTP thì in email ra log và coi như đã gửi (run-local.sh bật).
    # Production: để false — thiếu SMTP thì email bị bỏ qua kèm cảnh báo trong log.
    dev-log: ${MAIL_DEV_LOG:false}
  services:
    ai-face-service-url: ${AI_FACE_SERVICE_URL:http://localhost:8000}
  webauthn:
    # RP ID phải là host của origin (không gồm scheme/port). Khi demo qua tunnel HTTPS,
    # đặt WEBAUTHN_RP_ID=<tunnel-host> và WEBAUTHN_ALLOWED_ORIGINS=https://<tunnel-host>.
    rp-id: ${WEBAUTHN_RP_ID:localhost}
    rp-name: ${WEBAUTHN_RP_NAME:Ascend Tech}
    allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    # Origin động cho tunnel demo — RP ID tự suy ra từ host của Origin.
    # Production: đặt WEBAUTHN_ALLOWED_ORIGIN_PATTERNS='' để tắt.
    allowed-origin-patterns: ${WEBAUTHN_ALLOWED_ORIGIN_PATTERNS:https://*.trycloudflare.com,https://*.ngrok-free.app}
  push:
    # Demo/dev: sinh cặp khoá VAPID tạm khi khởi động. Production: đặt PUSH_ENABLED=true
    # kèm VAPID_PUBLIC_KEY/VAPID_PRIVATE_KEY cố định để subscription không mất hiệu lực
    # sau mỗi lần restart.
    enabled: ${PUSH_ENABLED:true}
    vapid:
      public-key: ${VAPID_PUBLIC_KEY:}
      private-key: ${VAPID_PRIVATE_KEY:}
      subject: ${VAPID_SUBJECT:mailto:it@act-corp.internal}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
