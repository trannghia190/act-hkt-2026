apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-face-service
  namespace: act-hr-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-face-service
  template:
    metadata:
      labels:
        app: ai-face-service
    spec:
      containers:
        - name: ai-face-service
          image: act-hr/ai-face-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-face-service
  namespace: act-hr-system
spec:
  selector:
    app: ai-face-service
  ports:
    - port: 8000
      targetPort: 8000
